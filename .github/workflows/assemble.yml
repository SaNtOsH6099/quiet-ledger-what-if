name: assemble-video
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Assembly job id, e.g. 21-full. Inputs must already be pushed to jobs-assemble/<job>/ : build.py, narration-norm wav, captions .ass (full cut only), cfg-manifest.json, frames.txt (one frame-artifact name per line). The frames themselves are downloaded from this repo's Actions artifacts."
        required: true
        type: string
      mode:
        description: "Cut to build: full (captioned) or clean (no karaoke captions)."
        required: true
        type: choice
        options:
          - full
          - clean

permissions:
  contents: read
  actions: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check tools
        run: |
          for t in ffmpeg ffprobe python3 jq unzip; do
            command -v $t >/dev/null 2>&1 && echo "have $t: $(command -v $t)" || echo "MISSING: $t"
          done
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "installing ffmpeg"
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]; then
            echo "installing dejavu fonts"
            sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core
          fi
          ls -la /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf

      - name: Download frame artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB: ${{ inputs.job }}
        run: |
          cd "jobs-assemble/$JOB"
          test -f frames.txt || { echo "frames.txt missing"; exit 1; }
          gh api "repos/SaNtOsH6099/quiet-ledger-what-if/actions/artifacts?per_page=100" > /tmp/artifacts.json
          total=$(jq '.total_count' /tmp/artifacts.json)
          echo "artifacts listed: $total"
          while read -r art; do
            [ -n "$art" ] || continue
            id=$(jq -r ".artifacts[] | select(.name==\"$art\") | .id" /tmp/artifacts.json | head -1)
            if [ -z "$id" ] || [ "$id" = "null" ]; then echo "artifact not found: $art"; exit 1; fi
            echo "downloading $art (id $id)"
            # Retry: concurrent batch assemblies hit transient 503s from the
            # artifact API (26-full failed on the first download, 2026-11-24).
            ok=0
            for attempt in 1 2 3 4 5; do
              if gh api "repos/SaNtOsH6099/quiet-ledger-what-if/actions/artifacts/$id/zip" > "$art.zip" && [ -s "$art.zip" ]; then ok=1; break; fi
              echo "download attempt $attempt failed for $art — retrying in 30s"
              sleep 30
            done
            [ "$ok" = "1" ] || { echo "download failed after 5 attempts: $art"; exit 1; }
            mkdir -p "$art"
            unzip -q -o "$art.zip" -d "$art"
            rm "$art.zip"
            echo "$art: $(ls "$art"/p_*.png | wc -l) frames"
          done < frames.txt

      - name: Assemble cut
        run: |
          cd "jobs-assemble/${{ inputs.job }}"
          ls
          python3 build.py "${{ inputs.mode }}"

      - name: Verify output
        run: |
          cd "jobs-assemble/${{ inputs.job }}"
          f=$(ls *.mp4 | head -1)
          echo "output: $f"
          ls -la "$f"
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of default=noprint_wrappers=1 "$f"
          # moov atom must be present (ffprobe reading duration proves it)
          dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
          echo "duration=$dur"

      - name: Rename for artifact
        # GitHub Artifacts rejects NTFS-unsafe chars in filenames — our
        # deliverable names contain "?" ("What If ... Existed?.mp4").
        # Upload under the safe job name; the hub renames it back to the
        # deliverable name after download.
        run: |
          cd "jobs-assemble/${{ inputs.job }}"
          f=$(ls *.mp4 | head -1)
          mv "$f" "${{ inputs.job }}.mp4"
          ls -la "${{ inputs.job }}.mp4"

      - uses: actions/upload-artifact@v4
        with:
          name: assemble-${{ inputs.job }}
          path: jobs-assemble/${{ inputs.job }}/${{ inputs.job }}.mp4
          retention-days: 30
